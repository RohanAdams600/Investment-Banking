name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build reads brand config from the environment. CI uses placeholders so a
  # missing production secret can never silently bake into an artifact.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Row Level Security cannot be verified without a database. Policies are
    # close to unreviewable by eye — a `using` where a `with check` was needed,
    # a missing FORCE — and every one of those is obvious the moment a wrong
    # role runs a query. So CI runs the queries.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cairn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before lint so a stale generated stylesheet fails fast with a clear
      # message rather than as a confusing visual regression later.
      - name: Verify design tokens are in sync
        run: pnpm --filter @ib/ui tokens:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # Present, so the RLS and schema-parity suites run rather than skip.
          # Their absence locally is what lets `pnpm test` work without a
          # database; their absence here would let policy regressions through.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cairn_test

      - name: Build
        run: pnpm build
